# CONFIGURAÇÃO DO BANCO DE DADOS (DINÂMICA)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:book_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:140208}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CONFIGURAÇÃO DO JWT (DINÂMICA POR SEGURANÇA)
jwt.secret=${JWT_SECRET:MY_SUPER_SECRET_KEY_123456789}
jwt.expiration=86400000